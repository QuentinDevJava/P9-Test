server:
  port: 5000 # Port de patientApi

spring:
  application:
    name: patientApi

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medilaboDB
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: true

  cloud:
    config:
     enabled: false

    discovery:
      enabled: true
eureka: 
 client: 
  service-url: 
   defaultZone: http://localhost:8761/eureka/ 
 instance:
   prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
