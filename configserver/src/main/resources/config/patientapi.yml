server:
  port: 5000

spring:
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medilaboDB
    username: root
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: true

eureka: 
  client: 
    service-url: 
      defaultZone: http://localhost:8761/eureka/ 
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  file:
    name: logs/mediLaboPatientApi.log
